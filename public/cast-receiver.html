<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobiQuiz TV</title><style>body{margin:0;background:#101320;color:white;display:grid;place-items:center;height:100vh;font:700 4vw system-ui}iframe{border:0;position:fixed;inset:0;width:100%;height:100%}</style><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script></head><body><div id="waiting">MobiQuiz · Esperando partida</div><script>const ctx=cast.framework.CastReceiverContext.getInstance();const ns='urn:x-cast:eu.mobiquiz.room';ctx.addCustomMessageListener(ns,event=>{const code=String(event.data?.code||'').toUpperCase();if(!/^[A-F0-9]{6}$/.test(code))return;let frame=document.querySelector('iframe');if(!frame){frame=document.createElement('iframe');frame.allow='autoplay; fullscreen';document.body.append(frame);}frame.src='/?screen='+code;});const options=new cast.framework.CastReceiverOptions();options.disableIdleTimeout=true;ctx.start(options);</script></body></html>
