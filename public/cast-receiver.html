<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobiQuiz TV</title><style>body{margin:0;background:#27194c;color:#fff1d3;display:grid;place-items:center;height:100vh;font:700 3vw system-ui;text-align:center}main img{width:15vw;max-width:200px;border-radius:20px}main p{color:#ffd55a;font-size:2vw}iframe{border:0;position:fixed;inset:0;width:100%;height:100%;background:#27194c}#diagnostic{font-size:1vw;opacity:.65}iframe[hidden]{display:none}</style></head><body><video class="castMediaElement" playsinline preload="none" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video><main><img src="/icons/mobiquiz-v2.webp" alt=""><h1>MobiQuiz</h1><p id="status">Iniciando Google Cast…</p><small id="diagnostic">Receptor v4</small></main><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><script>
(function(){
var status=document.getElementById('status'),ns='urn:x-cast:eu.mobiquiz.room',frame=null,code='',sender='',phase='loading',error='',ctx,timer;
function notify(type,message){try{if(sender)ctx.sendCustomMessage(ns,sender,{type:type,code:code,message:message||'',receiverVersion:4});}catch(e){show('Error al responder al móvil: '+e.message);}}
function show(text){status.textContent=text;}
function failed(message){clearTimeout(timer);phase='error';error=message;if(frame)frame.hidden=true;show(message);notify('error',message);}
if(!window.cast||!cast.framework){show('No se pudo cargar el SDK de Google Cast.');return;}
try{
ctx=cast.framework.CastReceiverContext.getInstance();
var options=new cast.framework.CastReceiverOptions();
options.customNamespaces={};options.customNamespaces[ns]=cast.framework.system.MessageType.JSON;
options.disableIdleTimeout=true;options.uiConfig={touchScreenOptimizedApp:true};options.statusText='MobiQuiz TV';
window.addEventListener('message',function(e){if(e.origin!==location.origin||!frame||e.source!==frame.contentWindow||!e.data||e.data.code!==code)return;if(e.data.type==='mq-screen-ready'){clearTimeout(timer);phase='ready';frame.hidden=false;notify('ready');}else if(e.data.type==='mq-screen-error'){failed(e.data.message||'No se pudo abrir la sala');}});
ctx.addCustomMessageListener(ns,function(event){var d=event.data;try{if(typeof d==='string')d=JSON.parse(d);}catch(e){return;}if(d&&d.type==='audio-settings'&&typeof d.music==='boolean'&&typeof d.sound==='boolean'){if(frame)frame.contentWindow.postMessage({type:'mq-tv-audio',music:d.music,sound:d.sound},location.origin);return;}var next=String(d&&d.code||'').toUpperCase();if(!/^[A-F0-9]{6}$/.test(next))return;sender=event.senderId;if(code===next&&frame&&phase!=='error'){notify(phase,error);return;}clearTimeout(timer);code=next;phase='loading';error='';show('Conectando a la sala '+code+'…');notify('loading');if(!frame){frame=document.createElement('iframe');frame.allow='autoplay; fullscreen';frame.title='Plató MobiQuiz';frame.hidden=true;document.body.appendChild(frame);}frame.hidden=true;frame.src='/?screen='+code+'&cast=1&tv=48';timer=setTimeout(function(){failed('La pantalla del concurso no responde. Comprueba la conexión a Internet de la TV.');},16000);});
ctx.addEventListener(cast.framework.system.EventType.READY,function(){if(!code)show('Esperando partida…');});
ctx.addEventListener(cast.framework.system.EventType.ERROR,function(e){failed('Error de Google Cast: '+(e.reason||e.errorCode||e.message||'desconocido'));});
ctx.start(options);
}catch(e){show('Error al iniciar Google Cast: '+e.message);}
})();
</script></body></html>
