<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobiQuiz TV</title><style>body{margin:0;background:#27194c;color:#fff1d3;display:grid;place-items:center;height:100vh;font:700 3vw system-ui;text-align:center}main img{width:15vw;max-width:200px;border-radius:20px}main p{color:#ffd55a;font-size:2vw}iframe{border:0;position:fixed;inset:0;width:100%;height:100%;background:#27194c}</style></head><body><main id="waiting"><img src="/icons/mobiquiz-v2.webp" alt=""><h1>MobiQuiz</h1><p id="status">Iniciando Google Cast…</p></main><script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script><script>
(function(){var status=document.getElementById('status'),ns='urn:x-cast:eu.mobiquiz.room',frame=null,code='',sender='',phase='loading',error='',ctx;function notify(type,message){try{ctx.sendCustomMessage(ns,sender,{type:type,code:code,message:message||''});}catch(e){}}function show(text){status.textContent=text;}if(!window.cast||!cast.framework){show('Google Cast no está disponible en este navegador.');return;}try{ctx=cast.framework.CastReceiverContext.getInstance();window.addEventListener('message',function(e){if(e.origin!==location.origin||!frame||e.source!==frame.contentWindow||!e.data||e.data.code!==code)return;if(e.data.type==='mq-screen-ready'){phase='ready';notify('ready');}else if(e.data.type==='mq-screen-error'){phase='error';error=e.data.message||'No se pudo abrir la sala';notify('error',error);}});ctx.addCustomMessageListener(ns,function(event){var d=event.data;try{if(typeof d==='string')d=JSON.parse(d);}catch(e){return;}var next=String(d&&d.code||'').toUpperCase();if(!/^[A-F0-9]{6}$/.test(next))return;sender=event.senderId;if(code===next&&frame){notify(phase,error);return;}code=next;phase='loading';error='';show('Conectando a la sala '+code+'…');notify('loading');if(!frame){frame=document.createElement('iframe');frame.allow='autoplay; fullscreen';frame.title='Plató MobiQuiz';document.body.appendChild(frame);}frame.src='/?screen='+code+'&cast=1';});ctx.addEventListener(cast.framework.system.EventType.READY,function(){show('Esperando partida…');});var options=new cast.framework.CastReceiverOptions();options.disableIdleTimeout=true;ctx.start(options);}catch(e){show('Error al iniciar Google Cast: '+e.message);}})();
</script></body></html>
