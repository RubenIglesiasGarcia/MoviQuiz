<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobiQuiz · Diagnóstico Cast</title><style>body{font:16px system-ui;background:#27194c;color:#fff1d3;max-width:700px;margin:32px auto;padding:20px}button,select{font:inherit;padding:12px;margin:8px 4px;border-radius:8px}pre{white-space:pre-wrap;background:#171020;padding:16px;min-height:160px;overflow-wrap:anywhere}button:disabled{opacity:.4}</style></head><body><h1>Diagnóstico Google Cast</h1><p>Selecciona un receptor, espera al estado preparado, y conecta la TV. Detén la sesión antes de cambiar de receptor.</p><label>Receptor <select id="receiver"><option value="CC1AD845">Google estándar (CC1AD845)</option><option value="D9734D3B">MobiQuiz (D9734D3B)</option></select></label><button id="connect" disabled>Conectar televisión</button><button id="stop" disabled>Detener sesión</button><pre id="log" aria-live="polite"></pre><script>
var log=document.getElementById('log'),sel=document.getElementById('receiver'),connect=document.getElementById('connect'),stop=document.getElementById('stop'),ctx;
function note(s){log.textContent+=new Date().toLocaleTimeString()+' '+s+'\n';}
function describe(e){return typeof e==='string'?e:JSON.stringify({code:e&&e.code,description:e&&e.description,details:e&&e.details,message:e&&e.message});}
function configure(){try{ctx.setOptions({receiverApplicationId:sel.value,autoJoinPolicy:chrome.cast.AutoJoinPolicy.PAGE_SCOPED});note('ID seleccionado: '+sel.value);connect.disabled=false;}catch(e){note('Error configurando: '+describe(e));}}
window.__onGCastApiAvailable=function(available){note('SDK disponible: '+available);if(!available)return;ctx=cast.framework.CastContext.getInstance();ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,function(e){note('Sesión: '+e.sessionState+(e.errorCode?' / '+e.errorCode:''));var active=!!ctx.getCurrentSession();sel.disabled=active;stop.disabled=!active;});ctx.addEventListener(cast.framework.CastContextEventType.CAST_STATE_CHANGED,function(e){note('Dispositivos: '+e.castState);});configure();};
sel.onchange=configure;connect.onclick=function(){connect.disabled=true;note('Solicitando sesión '+sel.value);ctx.requestSession().then(function(){var s=ctx.getCurrentSession();note('Sesión iniciada: '+(s?s.getSessionId():'sin sesión'));sel.disabled=true;stop.disabled=false;}).catch(function(e){note('ERROR: '+describe(e));}).then(function(){connect.disabled=false;});};stop.onclick=function(){ctx.endCurrentSession(true);sel.disabled=false;stop.disabled=true;note('Sesión detenida');};
note('Cargando SDK…');fetch('/api/config',{cache:'no-store'}).then(function(r){return r.json();}).then(function(c){note('App ID de Cloudflare: '+(c.castAppId||'(sin configurar)'));}).catch(function(){note('No se pudo consultar la configuración');});
</script><script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script></body></html>
