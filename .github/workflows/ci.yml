name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: node --check public/sw.js && node --check icons.js
      - run: npm test

      - name: Verify Cloudflare Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run --outdir /tmp/mobiquiz-worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
